<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4a044e"/>
      <stop offset="50%" stopColor="#701a75"/>
      <stop offset="100%" stopColor="#2e1065"/>
    </linearGradient>
    <linearGradient id="roseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f472b6"/>
      <stop offset="100%" stopColor="#fb7185"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg6)"/>

  <!-- Warm Embrace Hug Motif -->
  <g transform="translate(300, 190)">
    <circle cx="-35" cy="-35" r="32" fill="#fbcfe8" opacity="0.9"/>
    <circle cx="35" cy="-25" r="26" fill="#fef08a" opacity="0.9"/>
    <!-- Intertwined arms heart -->
    <path d="M-60 25 C-70 -20, 70 -20, 60 25 C50 65, 0 85, 0 85 C0 85, -50 65, -60 25 Z" fill="url(#roseGlow)" opacity="0.85"/>
  </g>

  <text x="300" y="340" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    The Safest Place in the World: Amma's Hug
  </text>
  <text x="300" y="375" font-family="'Noto Sans Telugu', sans-serif" font-size="16" fill="#fbcfe8" text-anchor="middle">
    అమ్మ ఒడిలోనే ఈ లోకపు సమస్త ప్రశాంతత 💖
  </text>
</svg>
