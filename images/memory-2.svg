<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e1b4b"/>
      <stop offset="50%" stopColor="#4338ca"/>
      <stop offset="100%" stopColor="#312e81"/>
    </linearGradient>
    <linearGradient id="smileGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a"/>
      <stop offset="100%" stopColor="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg2)"/>
  
  <!-- Glowing smiling moon -->
  <circle cx="300" cy="180" r="85" fill="url(#smileGlow)" opacity="0.9"/>
  <!-- Smile arc -->
  <path d="M260 190 Q300 235 340 190" stroke="#4338ca" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Happy eyes -->
  <path d="M265 160 Q275 148 285 160" stroke="#4338ca" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M315 160 Q325 148 335 160" stroke="#4338ca" stroke-width="5" stroke-linecap="round" fill="none"/>

  <text x="300" y="340" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    That Radiant Smile
  </text>
  <text x="300" y="375" font-family="'Noto Sans Telugu', sans-serif" font-size="16" fill="#fef08a" text-anchor="middle">
    ప్రపంచాన్ని వెలిగించే నీ చిరునవ్వు 😊
  </text>
</svg>
