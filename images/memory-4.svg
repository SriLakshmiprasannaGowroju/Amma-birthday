<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0f172a"/>
      <stop offset="50%" stopColor="#334155"/>
      <stop offset="100%" stopColor="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="steamingBowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ec4899"/>
      <stop offset="100%" stopColor="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg4)"/>

  <!-- Warm Bowl of delicious food & heart steam -->
  <path d="M220 200 C220 280 380 280 380 200 Z" fill="url(#steamingBowl)"/>
  <ellipse cx="300" cy="200" rx="80" ry="20" fill="#fbcfe8"/>
  <!-- Heart rising steam -->
  <path d="M280 160 Q270 140 285 125 T295 95" stroke="#f472b6" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M320 160 Q330 140 315 125 T305 95" stroke="#c084fc" stroke-width="4" fill="none" stroke-linecap="round"/>

  <text x="300" y="340" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Made with Mother's Love
  </text>
  <text x="300" y="375" font-family="'Noto Sans Telugu', sans-serif" font-size="16" fill="#fbcfe8" text-anchor="middle">
    అమ్మ చేతి అమృతపు వంట 🍲
  </text>
</svg>
